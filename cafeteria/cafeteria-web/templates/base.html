<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/icons.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <title>CoffeeAdmin - {% block titulo %}Cafetería{% endblock %}</title>
  {% block css %}{% endblock %}
</head>
<body>
  <aside>
    <div class="sidebar-logo">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path d="M18 8h1a4 4 0 010 8h-1M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8zM6 1v3M10 1v3M14 1v3" />
      </svg>
      <h1>CoffeeAdmin</h1>
    </div>
    <ul class="sidebar-menu">
      <li class="sidebar-item">
        <a href="{{ url_for('dashboard') }}">
          <i class="bi bi-grid-1x2 ui-icon" aria-hidden="true"></i>
          Dashboard
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('productos') }}">
          <i class="bi bi-box-seam ui-icon" aria-hidden="true"></i>
          Productos / Insumos
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('pedidos') }}">
          <i class="bi bi-receipt ui-icon" aria-hidden="true"></i>
          Pedidos
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('categorias') }}">
          <i class="bi bi-tags ui-icon" aria-hidden="true"></i>
          Categorías
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('usuarios') }}">
          <i class="bi bi-people ui-icon" aria-hidden="true"></i>
          Módulo de Usuario
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('reportes') }}">
          <i class="bi bi-graph-up ui-icon" aria-hidden="true"></i>
          Reportes
        </a>
      </li>
      <li class="sidebar-item">
        <a href="{{ url_for('estadisticas') }}">
          <i class="bi bi-bar-chart ui-icon" aria-hidden="true"></i>
          Estadísticas
        </a>
      </li>
    </ul>
  </aside>
  <div class="sidebar-backdrop" aria-hidden="true"></div>

  <div class="main-wrapper">
    <main>
      {% block contenido %}{% endblock %}
    </main>
  </div>

  <script src="{{ url_for('static', filename='js/sidebar.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
