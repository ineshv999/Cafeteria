databases:
  - name: cafeteria-db
    databaseName: cafeteria
    user: cafeteria
    plan: free

services:
  - type: web
    name: cafeteria-api
    runtime: python
    plan: free
    rootDir: cafeteria/cafeteria-api
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        fromDatabase:
          name: cafeteria-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60

  - type: web
    name: cafeteria-web
    runtime: python
    plan: free
    rootDir: cafeteria/cafeteria-web
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SECRET_KEY
        generateValue: true
      - key: API_URL
        fromService:
          type: web
          name: cafeteria-api
          property: hostport
